[build]
    command = "npm run build"
    publish = "dist"

[build.environment]
    NODE_VERSION = "22"

[[headers]]
    for = "/*"
    [headers.values]
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
        X-Frame-Options = "DENY"
        Permissions-Policy = "camera=(), microphone=(), geolocation=()"
        Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
    for = "/index.html"
    [headers.values]
        Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
    for = "/locales/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/teach/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/fonts/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/images/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
    for = "/catalogue/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"
